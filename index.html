    <title>XMB-PS3</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="assets/icons/logotipo-de-playstation.png" type="image/x-icon">

<body>
    <div id="start-screen">
        <a id="start-button" href="#" class="ps3-button">
            <img src="assets/icons/logotipo-de-playstation.png" alt="Icono de PlayStation 3" class="ps3-icon">
            <span class="button-text">START</span>
        </a>
    </div>
    <div id="page-overlay">
        <!-- PS3  text-->
        <div id="ps3-logo1" class="ps3-logo-position">

            <div class="ps3-logo-text">
                <img class="ps3-logo-icon" src="/assets/icons/logotipo-de-playstation.png" alt="">

                PS3

            </div>
            <span class="ps3-text">
                PlayStation&#174; 3
            </span>
        </div>

    </div>
    <canvas id="bg"></canvas>
    <div id="bg-cover"></div>

    <div class="status-bar bg-status">
        <p>
            Active menu item index: <span id="active-menu-item-index-display"></span>
        </p>
        <p>
            Active sub menu item index: <span id="active-sub-menu-item-index-display"></span>
        </p>
    </div>
    <div class="ps3-status-bar">

        <div class="clock-wrapper">
            <div class="clock-wrapper">
                <span id="timeText"></span>

                <svg class="clock" viewBox="0 0 100 100">
                    <!-- Borde -->
                    <circle cx="50" cy="50" r="45" class="clock-face" />

                    <!-- Manecillas -->
                    <line id="hourHand" x1="50" y1="50" x2="50" y2="20" />
                    <line id="minuteHand" x1="50" y1="50" x2="50" y2="10" />

                    <!-- Centro -->
                    <circle cx="50" cy="50" r="2.5" class="clock-center" />
                </svg>

            </div>


        </div>

    </div>
