<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMB-PS3</title>
    <link rel="stylesheet" href="src/engine/xmb.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="assets/icons/logotipo-de-playstation.png" type="image/x-icon">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>

<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>

    <div id="start-screen" class="start-screen">
        <button id="start-button" class="ps3-button" type="button">
            <img src="assets/icons/logotipo-de-playstation.png" alt="" class="ps3-icon">
            <span class="button-text">START</span>
        </button>
    </div>

    <div id="splash" class="splash" hidden>
        <div class="splash__logo">
            <div class="ps3-logo-text">
                <img class="ps3-logo-icon" src="assets/icons/logotipo-de-playstation.png" alt="">
                PS3
            </div>
            <span class="ps3-text">PlayStation&#174; 3</span>
        </div>
    </div>

    <div id="stage">
        <header id="status-bar" class="status-bar" hidden>
            <div id="clock" class="clock-wrapper"></div>
        </header>

        <main id="xmb" class="xmb-root"></main>
    </div>

    <div id="debug-overlay" class="debug-overlay" hidden></div>

    <script type="module" src="src/app/main.js"></script>
</body>

</html>
